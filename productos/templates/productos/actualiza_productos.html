{% extends "base.html" %}

{% block titulo %}
Editar Producto | Distribuidora GABT
{% endblock %}

{% block contenido %}

<h2 class="mb-4 fw-bold text-center text-md-start">Editar Producto</h2>

<div class="card shadow-sm">
    <div class="card-body">

        <form method="post">
            {% csrf_token %}

            <!-- Campos editables -->
            <div class="mb-3">
                <label class="form-label">Producto</label>
                {{ form.nombre }}
            </div>

            <div class="mb-3">
                <label class="form-label">Precio</label>
                {{ form.precio }}
            </div>

            <div class="mb-3">
                <label class="form-label">Stock</label>
                {{ form.stock }}
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-dark">
                    Guardar cambios
                </button>

                <a href="{% url 'productos:visualizar_producto' producto.numero_producto %}" class="btn btn-secondary">
                    Cancelar
                </a>
            </div>

        </form>

    </div>
</div>

{% endblock %}
