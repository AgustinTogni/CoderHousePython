{% extends "base.html" %}

{% block titulo %}
Nuevo Producto | Distribuidora GABT
{% endblock %}

{% block contenido %}

<h2 class="mb-4 fw-bold text-center text-md-start">
    Agregar Producto
</h2>

<div class="card shadow-sm">
    <div class="card-body">

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">
                    Número de producto
                    <span class="text-muted">(ingresar: {{ numero_actual }})</span>
                </label>
                {{ form.numero_producto }}
            </div>

            <div class="mb-3">
                <label class="form-label">Nombre</label>
                {{ form.nombre }}
            </div>

            <div class="mb-3">
                <label class="form-label">Precio</label>
                {{ form.precio }}
            </div>

            <div class="mb-3">
                <label class="form-label">Stock</label>
                {{ form.stock }}
            </div>

            <div class="d-flex flex-column flex-md-row gap-2 mt-3">
                <button type="submit" class="btn btn-dark">
                    Guardar producto
                </button>

                <a href="{% url 'productos:listar_productos' %}" class="btn btn-secondary">
                    Cancelar
                </a>
            </div>

        </form>

    </div>
</div>

{% endblock %}
