<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <!-- RESPONSIVE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block titulo %}Distribuidora GABT{% endblock %}</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

    <!-- NAVBAR -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm py-3">
            <div class="container-lg">

                <!-- BRAND -->
                <a class="navbar-brand fw-bold" href="/">
                    Distribuidora GABT
                </a>

                <!-- BOTON MOBILE -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Abrir menú">

                    <span class="navbar-toggler-icon"></span>
                </button>

                <!-- MENU -->
                <div class="collapse navbar-collapse" id="navbarNav">

                    <ul class="navbar-nav ms-auto text-center text-lg-start mt-3 mt-lg-0 gap-lg-2">

                        {% if user.is_authenticated %}

                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'productos:listar_productos' %}">
                                Productos
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'clientes:listar_clientes' %}">
                                Clientes
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'proveedores:listar_proveedores' %}">
                                Proveedores
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'cuentas:perfil_detail' %}">
                                {{ user.username }}
                            </a>
                        </li>

                        {% else %}

                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'cuentas:login' %}">
                                Iniciar sesión
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-white" href="{% url 'cuentas:register' %}">
                                Registrarse
                            </a>
                        </li>

                        {% endif %}

                    </ul>

                </div>
            </div>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main class="flex-fill py-4 py-md-5">
        <div class="container-lg">

            {% block contenido %}
            {% endblock %}

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container-lg">

            <small class="d-block">
                © 2026 - Distribuidora GABT
            </small>

        </div>
    </footer>

    <!-- JS BOOTSTRAP -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

</body>

</html>
